server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Runtime-injected env — must never be cached, it can differ per
	# deployment of the exact same image (see docker-entrypoint.d/).
	location = /env.js {
		add_header Cache-Control "no-store";
	}

	# Hashed build assets are safe to cache forever.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# TanStack Router uses client-side routing — always fall back to
	# index.html so a hard refresh on e.g. /editor doesn't 404.
	location / {
		try_files $uri $uri/ /index.html;
	}

	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
}
